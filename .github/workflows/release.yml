name: Release

# A release is a commit whose versions were set with scripts/set-version.mjs, tagged v<version>.
# See RELEASING.md. Run it by hand with dry_run to check everything without uploading.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and check the artifacts without uploading them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version matches the tag
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$version" == *-SNAPSHOT ]]; then
            echo "::error::Snapshots are not released"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm test
      - run: ./gradlew build -PmustacheReact.skipFrontend
      - run: ./gradlew -p build-plugins build -PtestGradle7JavaHome=$JAVA_HOME_17_X64
      - run: scripts/consumer-test.sh "$RUNNER_TEMP/consumer"

  maven-central:
    name: Maven Central
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage signed artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToStagingRepository
          ./gradlew -p build-plugins publishAllPublicationsToStagingRepository
      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.dry_run }}" == true ]]; then
            if [[ "${{ needs.verify.outputs.version }}" == *-SNAPSHOT ]]; then
              echo "Snapshot version: staged only (run set-version.mjs on a branch to dry-run a release)."
              find build/staging-deploy -name '*.pom' | sort
            else
              scripts/publish-central.sh --dry-run
            fi
          else
            scripts/publish-central.sh
          fi

  gradle-plugin-portal:
    name: Gradle Plugin Portal
    needs: [verify, maven-central]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish run.iknow.mustache-react
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.dry_run }}" == true ]]; then
            # The portal validates against the account, so validation needs the real keys.
            if [[ "${{ needs.verify.outputs.version }}" == *-SNAPSHOT ]]; then
              echo "Snapshot version: the Plugin Portal takes fixed versions only; skipping validation."
            elif [[ -z "$GRADLE_PUBLISH_KEY" ]]; then
              echo "::warning::GRADLE_PUBLISH_KEY is not set; skipping the Plugin Portal validation."
            else
              ./gradlew -p build-plugins publishPlugins --validate-only \
                -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
            fi
          else
            ./gradlew -p build-plugins publishPlugins \
              -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
          fi

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./js/*" run build
      - name: Publish @mustache-react/*
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.dry_run }}" == true ]]; then
            pnpm --filter "./js/*" publish --dry-run --no-git-checks
          else
            pnpm --filter "./js/*" publish --access public --no-git-checks
          fi

  github-release:
    name: GitHub release
    needs: [verify, maven-central, gradle-plugin-portal, npm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "mustache-react $VERSION" --notes-file notes.md
