name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java (Boot ${{ matrix.boot }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Library binary is always compiled for Java 8 against Boot 2.7 APIs;
          # each row runs the tests and the example app on another Boot/JDK pair.
          - { boot: 2.7.18, java: 8 }
          - { boot: 3.5.16, java: 17 }
          - { boot: 4.1.2, java: 21 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last entry becomes JAVA_HOME and runs Gradle; the matrix JDK runs the tests.
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: >
          ./gradlew build
          -PspringBootVersion=${{ matrix.boot }}
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
          -PskipFrontend
      - name: Generated TypeScript types are up to date
        run: |
          changes=$(git status --porcelain -- examples/basic/src/main/frontend/generated)
          if [ -n "$changes" ]; then
            echo "::error::Generated types differ from the committed ones. Run ./gradlew build and commit the result."
            echo "$changes"; git diff -- examples/basic/src/main/frontend/generated
            exit 1
          fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-boot-${{ matrix.boot }}-java-${{ matrix.java }}
          path: '**/build/reports/tests/'

  js:
    name: JS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser e2e (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [2.7.18, 4.1.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the example app
        run: |
          ./gradlew :examples:basic:run -PspringBootVersion=${{ matrix.boot }} --args=--server.port=18080 > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:18080/ && exit 0; sleep 2; done
          cat app.log; exit 1
      - run: pnpm e2e
        env:
          BASE_URL: http://localhost:18080
      - name: App log
        if: failure()
        run: cat app.log

  dev-e2e:
    name: Dev server e2e (HMR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the Vite dev server and the app in the dev profile
        run: |
          pnpm dev:example > vite.log 2>&1 &
          ./gradlew :examples:basic:run -PskipFrontend --args="--server.port=18080 --spring.profiles.active=dev" > app.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:18080/ && curl -sf -o /dev/null http://localhost:5173/mustache-react/@vite/client && exit 0
            sleep 2
          done
          cat vite.log app.log; exit 1
      - run: pnpm e2e:dev
        env:
          BASE_URL: http://localhost:18080
      - name: Logs
        if: failure()
        run: cat vite.log app.log
