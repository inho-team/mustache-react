name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (Boot ${{ matrix.boot }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Library binary is always compiled for Java 8 against Boot 2.7 APIs;
          # each row runs the tests and the example app on another Boot/JDK pair.
          - { boot: 2.7.18, java: 8 }
          - { boot: 3.5.16, java: 17 }
          - { boot: 4.1.2, java: 21 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last entry becomes JAVA_HOME and runs Gradle; the matrix JDK runs the tests.
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: >
          ./gradlew build
          -PspringBootVersion=${{ matrix.boot }}
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
          -PmustacheReact.skipFrontend
      - name: Generated TypeScript types are up to date
        run: |
          changes=$(git status --porcelain -- examples/basic/src/main/frontend/generated)
          if [ -n "$changes" ]; then
            echo "::error::Generated types differ from the committed ones. Run ./gradlew build and commit the result."
            echo "$changes"; git diff -- examples/basic/src/main/frontend/generated
            exit 1
          fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-boot-${{ matrix.boot }}-java-${{ matrix.java }}
          path: '**/build/reports/tests/'

  build-plugins:
    name: Build plugins (Gradle, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 runs the Gradle 7.6 compatibility test; 21 runs the build.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the build tools and the Gradle plugin
        run: ./gradlew -p build-plugins build -PtestGradle7JavaHome=$JAVA_HOME_17_X64

  maven:
    name: Maven example (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { boot: 2.7.18, release: 8 }
          - { boot: 4.1.2, release: 17 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Publish mustache-react to the local Maven repository
        run: |
          ./gradlew publishToMavenLocal
          ./gradlew -p build-plugins publishToMavenLocal
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@mustache-react-examples/basic^..." run build
      - name: mvn package
        working-directory: examples/basic
        # types.ts is removed first: the processor must write it back without a compiler argument.
        run: |
          rm src/main/frontend/generated/types.ts
          mvn -B package -Dspring-boot.version=${{ matrix.boot }} -Dmaven.compiler.release=${{ matrix.release }}
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- examples/basic/src/main/frontend/generated
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser e2e against the Maven-built jar
        run: |
          java -jar examples/basic/target/basic-0.1.0-SNAPSHOT.jar --server.port=18080 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:18080/ && break; sleep 1; done
          BASE_URL=http://localhost:18080 pnpm e2e || (cat app.log; exit 1)

  consumer:
    name: Consumer project (published-form artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build examples/consumer like an outside project and run it
        run: scripts/consumer-test.sh "$RUNNER_TEMP/consumer"

  windows:
    name: Windows (build plugins, Java, consumer project)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build plugins (Node.js zip download, npm.cmd, Gradle 7.6)
        run: ./gradlew -p build-plugins build "-PtestGradle7JavaHome=$JAVA_HOME_17_X64"
      - name: Java modules and example tests
        run: ./gradlew build -PmustacheReact.skipFrontend
      - name: Consumer project
        run: scripts/consumer-test.sh "$RUNNER_TEMP/consumer"

  js:
    name: JS packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser e2e (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boot: [2.7.18, 4.1.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the example app
        run: |
          ./gradlew :examples:basic:run -PspringBootVersion=${{ matrix.boot }} --args=--server.port=18080 > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:18080/ && exit 0; sleep 2; done
          cat app.log; exit 1
      - run: pnpm e2e
        env:
          BASE_URL: http://localhost:18080
      - name: Restart the app with its assets on a separate server (CDN)
        run: |
          pkill -f examples.basic.BasicApplication || true
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:18080/ || break; sleep 1; done
          ./gradlew :examples:basic:run -PspringBootVersion=${{ matrix.boot }} "--args=--server.port=18080 --mustache-react.public-path=http://localhost:18081/" > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:18080/ && exit 0; sleep 2; done
          cat app.log; exit 1
      - run: pnpm e2e:cdn
        env:
          BASE_URL: http://localhost:18080
      - name: App log
        if: failure()
        run: cat app.log

  dev-e2e:
    name: Dev server e2e (HMR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build the workspace packages
        run: pnpm --filter "@mustache-react-examples/basic^..." run build
      - name: Start the app in the dev profile (it starts the Vite dev server)
        run: |
          ./gradlew :examples:basic:run -PmustacheReact.skipFrontend --args="--server.port=18080 --spring.profiles.active=dev" > app.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:18080/ && curl -sf -o /dev/null http://localhost:5173/mustache-react/@vite/client && exit 0
            sleep 2
          done
          cat app.log; exit 1
      - run: pnpm e2e:dev
        env:
          BASE_URL: http://localhost:18080
      - name: Logs
        if: failure()
        run: cat app.log
