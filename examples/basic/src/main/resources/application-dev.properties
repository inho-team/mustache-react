# Development profile:
#   ./gradlew :examples:basic:run --args=--spring.profiles.active=dev
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev

# Load the frontend from the Vite dev server (hot module replacement, no frontend build needed).
# The application starts the dev server itself and stops it on shutdown.
mustache-react.dev-server.enabled=true

# Read Mustache templates from the sources, so edits show on the next request without rebuilding.
spring.mustache.prefix=file:src/main/resources/templates/
spring.mustache.servlet.cache=false
