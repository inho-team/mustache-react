<!doctype html>
<html th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org" xmlns:react="https://iknow.run/mustache-react">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{board.title}">주문 보드</title>
  <!-- the entry's stylesheets (app.css) -->
  <react:head />
</head>
<body>
<main class="page">
  <h1 th:text="#{board.title}">주문 보드</h1>
  <p th:text="#{board.intro}">Thymeleaf 템플릿입니다.</p>

  <!-- islands/OrderChart.tsx; ${...} values are passed as objects, other values as strings -->
  <react:OrderChart orders="${orders}" currency="${currency}" />

  <table>
    <thead>
      <tr>
        <th th:text="#{orders.column.id}">번호</th>
        <th th:text="#{orders.column.customer}">고객</th>
        <th th:text="#{orders.column.status}">상태</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1001</td>
        <td th:text="${order.customer}">김민수</td>
        <!-- one island per row; order-id becomes the prop orderId -->
        <td><react:StatusBadge status="${order.status}" order-id="${order.id}" /></td>
      </tr>
    </tbody>
  </table>
</main>
<!-- after the last island: the server context, then the script that mounts the islands -->
<react:scripts />
</body>
</html>
