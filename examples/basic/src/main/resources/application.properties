spring.mustache.charset=UTF-8
# messages.properties is Korean; without this, a request for Korean on a server whose system locale is English
# would get messages_en.properties.
spring.messages.fallback-to-system-locale=false

# Messages exposed to React (useMessages().t): keys or prefixes
mustache-react.context.messages=app.name,nav.*,orders.*
# ?lang=en switches the language (kept in a cookie); Korean until the user picks one
mustache-react.i18n.param=lang
mustache-react.i18n.locales=ko,en
mustache-react.i18n.default-locale=ko

# Render pages and islands on the server (Node.js sidecar running the SSR bundle), with the browser as fallback
mustache-react.ssr=auto
